spring.application.name=Vetopia
server.port=8090

#datasource
spring.jpa.database=h2

#utiliza el driver de h2
spring.datasource.driver-class-name=org.h2.Driver

#Nombre de la base de datos

#url
spring.datasource.url=jdbc:h2:file:./mydatabase
#nombre de usuario y contraseña
spring.datasource.username=sa
spring.datasource.password=


#Consola de administracion de H2 con UI
spring.h2.console.enabled=true
#localhost:8090/h2
spring.h2.console.path=/h2

#Datos de prueba
spring.jpa.generate-ddl=true
#borrar la tabla cada vez
spring.jpa.hibernate.ddl-auto=create-drop

#logging
#Permite imprimir la query
logging.level.org.hibernate.SQL=DEBUG
#Imprimir los parametros de las quieries
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.format_sql=true
















# Locale en español para el formato de fechas de Thymeleaf (#temporals)
spring.web.locale=es_CO
spring.web.locale-resolver=fixed

# Desactivar caché de plantillas durante el desarrollo
spring.thymeleaf.cache=false

# Límite de subida de fotos (coincide con el "Max 5MB" del formulario de mascotas)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
