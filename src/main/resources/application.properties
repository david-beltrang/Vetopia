spring.application.name=Vetopia
server.port=8080

#datasource
spring.jpa.database=h2
spring.datasource.driver-class-name=org.h2.Driver
#nombre base de datos
spring.datasource.url=jdbc:h2:file:./mydatabase
spring.datasource.username=sa
spring.datasource.password=

#consola de administracion de h2
spring.h2.console.enabled=true
#localhost:8080/h2
spring.h2.console.path=/h2

# Datos de prueba
spring.jpa.generate-ddl=true
#borrar la tabla cada vez
spring.jpa.hibernate.ddl-auto=create-drop
#spring.sql.init.mode=

# Logging
#permite imprimir la query
logging.level.org.hibernate.SQL=DEBUG
#imrime los parametros de las querys
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.format_sql=true

# Local en español para el formato de fechas de Thymeleaf (#temporals)
spring.web.locale=es_CO
spring.web.locale-resolver=fixed

# Desactivar caché de plantillas durante el desarrollo
spring.thymeleaf.cache=false

# Límite de subida de fotos (coincide con el "Max 5MB" del formulario de mascotas)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

