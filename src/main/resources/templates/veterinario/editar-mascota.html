<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragmentos-portal :: head"></div>
    <title>Vetopia - Editar Mascota</title>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
    <!-- HEADER del portal -->
    <nav class="w-full top-0 sticky bg-[#0f1115] shadow-sm z-50">
        <div class="flex justify-between items-center w-full px-gutter max-w-container-max mx-auto h-20">
            <!-- Logo -->
            <div class="flex items-center">
                <a href="/" class="flex items-center">
                    <img th:src="@{/images/logo_Vetopia.png}" alt="Vetopia Logo" class="h-8 w-auto object-contain"/>
                </a>
            </div>
            <!-- Enlaces de navegación -->
            <div class="hidden md:flex items-center gap-8">
                <a th:href="@{/veterinario/mascotas(veterinarioId=${veterinarioId})}" class="text-gray-400 hover:text-primary transition-colors font-body-md text-body-md">Pacientes</a>
                <a th:href="@{/veterinario/clientes(veterinarioId=${veterinarioId})}" class="text-gray-400 hover:text-primary transition-colors font-body-md text-body-md">Clientes</a>
                <a href="#" class="text-gray-400 hover:text-primary transition-colors font-body-md text-body-md">Citas</a>
                <a th:href="@{/veterinario/mascotas/tratamientos(veterinarioId=${veterinarioId})}" class="text-gray-400 hover:text-primary transition-colors font-body-md text-body-md">Tratamientos</a>
            </div>
            <!-- Trailing: notificaciones, usuario, logout -->
            <div class="flex items-center gap-4">
                <button class="w-10 h-10 rounded-full flex items-center justify-center text-white hover:bg-white/10 transition-colors">
                    <span class="material-symbols-outlined text-2xl">notifications</span>
                </button>
                <div class="flex items-center gap-3">
                    <span class="text-white font-label-md text-label-md tracking-widest hidden sm:inline" th:text="${veterinario != null ? veterinario.nombre : 'Veterinario'}">Veterinario</span>
                    <div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center">
                        <span class="text-on-primary-container font-bold text-body-md" th:text="${veterinario != null ? #strings.substring(veterinario.nombre,0,2) : 'VT'}">VT</span>
                    </div>
                </div>
                <a class="px-6 py-3 rounded-full border border-gray-600 text-white font-button text-button uppercase hover:bg-white/5 transition-colors" th:href="@{/login}">
                    Logout
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1">
        <div class="max-w-container-max mx-auto px-gutter py-stack-lg">
            <!-- Título y subtítulo -->
            <div class="mb-stack-lg">
                <h1 class="text-headline-xl font-headline-xl text-on-surface mb-1">Editar Mascota</h1>
                <p class="text-body-lg font-body-lg text-on-surface-variant">Modifica los detalles de la mascota</p>
            </div>

            <!-- Formulario -->
            <form class="flex flex-col items-center gap-stack-lg" th:action="@{/veterinario/mascotas/editar}" method="post" enctype="multipart/form-data">
                <!-- Identificador de la mascota, veterinario logueado y dueño asociado -->
                <input type="hidden" name="id" th:value="${mascota != null ? mascota.id : ''}"/>
                <input type="hidden" name="veterinarioId" th:if="${veterinarioId != null}" th:value="${veterinarioId}"/>
                <input type="hidden" name="dueno.id" th:value="${mascota != null and mascota.dueno != null ? mascota.dueno.id : ''}"/>
                <!-- Tarjeta del formulario -->
                <div class="w-full bg-surface-container-lowest p-8 rounded-xl shadow-[0px_10px_30px_rgba(0,0,0,0.04)] border border-outline-variant max-w-[604px]">
                    <!-- Encabezado de sección -->
                    <div class="border-b border-surface-container-highest pb-4 mb-6">
                        <div class="flex items-center gap-3">
                            <div class="w-5 h-5 bg-primary rounded-full"></div>
                            <h2 class="text-headline-lg font-headline-lg text-on-surface">Información de la Mascota</h2>
                        </div>
                    </div>

                    <!-- Campos del formulario -->
                    <div class="flex flex-col gap-6">
                        <!-- Subida de foto -->
                        <label id="fotoLabel" class="flex flex-col items-center gap-2 p-6 bg-background rounded-xl border-2 border-outline-variant border-dashed cursor-pointer transition hover:border-primary">
                            <img id="previewFoto" th:if="${mascota != null and mascota.tieneImagen()}" th:src="${mascota.imagen}"
                                 class="w-24 h-24 rounded-full object-cover border border-outline"/>
                            <img id="previewFotoVacia" th:unless="${mascota != null and mascota.tieneImagen()}" class="hidden w-24 h-24 rounded-full object-cover border border-outline"/>
                            <div id="iconoFoto" th:if="${mascota == null or !mascota.tieneImagen()}" class="w-20 h-20 rounded-full bg-secondary-container flex items-center justify-center">
                                <span class="material-symbols-outlined text-4xl text-on-secondary-container">pets</span>
                            </div>
                            <span class="text-primary font-label-md text-label-md uppercase tracking-widest cursor-pointer hover:underline">Click para subir foto</span>
                            <span class="text-on-surface-variant text-sm">JPG or PNG (Max 5MB)</span>
                            <input id="inputFoto" type="file" name="foto" accept="image/png,image/jpeg,image/gif" class="hidden"/>
                        </label>

                        <!-- Nombre y Raza - Grid 2 columnas -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="flex flex-col gap-2">
                                <label for="nombre" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Nombre mascota</label>
                                <input id="nombre" name="nombre" type="text"
                                       class="w-full px-4 py-3 bg-background rounded border border-outline-variant text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                       placeholder="e.g. Max"
                                       th:value="${mascota != null ? mascota.nombre : ''}" />
                            </div>
                            <div class="flex flex-col gap-2">
                                <label for="raza" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Raza</label>
                                <input id="raza" name="raza" type="text"
                                       class="w-full px-4 py-3 bg-background rounded border border-outline-variant text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                       placeholder="e.g. Golden Retriever"
                                       th:value="${mascota != null ? mascota.raza : ''}" />
                            </div>
                        </div>

                        <!-- Edad y Peso - Grid 2 columnas -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="flex flex-col gap-2">
                                <label for="edad" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Edad (Años)</label>
                                <input id="edad" name="edad" type="number" step="0.1" min="0"
                                       class="w-full px-4 py-3 bg-background rounded border border-outline-variant text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                       placeholder="e.g. 2"
                                       th:value="${mascota != null ? mascota.edad : ''}" />
                            </div>
                            <div class="flex flex-col gap-2">
                                <label for="pesoKg" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Peso (kg)</label>
                                <input id="pesoKg" name="pesoKg" type="number" step="0.1" min="0"
                                       class="w-full px-4 py-3 bg-background rounded border border-outline-variant text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                       placeholder="e.g. 15.5"
                                       th:value="${mascota != null ? mascota.pesoKg : ''}" />
                            </div>
                        </div>

                        <!-- Especie y Sexo - Grid 2 columnas -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="flex flex-col gap-2">
                                <label for="especie" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Especie</label>
                                <select id="especie" name="especie"
                                        class="w-full px-4 py-3 bg-background rounded border border-outline-variant text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                                    <option value="">Seleccionar especie...</option>
                                    <option value="PERRO" th:selected="${mascota != null and mascota.especie != null and mascota.especie.name() == 'PERRO'}">Perro</option>
                                    <option value="GATO" th:selected="${mascota != null and mascota.especie != null and mascota.especie.name() == 'GATO'}">Gato</option>
                                    <option value="OTRO" th:selected="${mascota != null and mascota.especie != null and mascota.especie.name() == 'OTRO'}">Otro</option>
                                </select>
                            </div>
                            <div class="flex flex-col gap-2">
                                <label for="sexo" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Sexo</label>
                                <select id="sexo" name="sexo"
                                        class="w-full px-4 py-3 bg-background rounded border border-outline-variant text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                                    <option value="">Seleccionar sexo...</option>
                                    <option value="MACHO" th:selected="${mascota != null and mascota.sexo != null and mascota.sexo.name() == 'MACHO'}">Macho</option>
                                    <option value="HEMBRA" th:selected="${mascota != null and mascota.sexo != null and mascota.sexo.name() == 'HEMBRA'}">Hembra</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Botones de acción -->
                <div class="flex flex-wrap items-center justify-between gap-4 pt-6 border-t border-outline-variant">
                    <a class="inline-flex items-center gap-2 rounded-full bg-tertiary px-8 py-3 font-button text-button uppercase tracking-widest text-on-tertiary transition-colors hover:bg-tertiary-container hover:text-on-tertiary-container"
                       th:href="@{/veterinario/mascotas/ficha(veterinarioId=${veterinarioId}, id=${mascota.id})}">
                        Cancelar
                    </a>
                    <button type="submit" class="inline-flex items-center gap-2 rounded-full bg-primary px-8 py-3 font-button text-button uppercase tracking-widest text-on-primary transition-colors hover:bg-primary-container hover:text-on-primary-container">
                        Finalizado
                        <span class="material-symbols-outlined text-lg">check</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer th:replace="fragmentos-portal :: footer"></footer>

    <!-- Vista previa de la foto seleccionada antes de subirla -->
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            const input = document.getElementById('inputFoto');
            const preview = document.getElementById('previewFoto');
            const previewVacia = document.getElementById('previewFotoVacia');
            const icono = document.getElementById('iconoFoto');
            const texto = document.querySelector('#fotoLabel .text-primary');

            input.addEventListener('change', function () {
                const archivo = input.files && input.files[0];
                if (archivo && archivo.type.startsWith('image/')) {
                    const lector = new FileReader();
                    lector.onload = function (e) {
                        if (preview) {
                            preview.src = e.target.result;
                            preview.classList.remove('hidden');
                        }
                        if (previewVacia) {
                            previewVacia.src = e.target.result;
                            previewVacia.classList.remove('hidden');
                        }
                        if (icono) {
                            icono.classList.add('hidden');
                        }
                        if (texto) {
                            texto.textContent = archivo.name;
                        }
                    };
                    lector.readAsDataURL(archivo);
                } else {
                    if (preview) {
                        preview.classList.add('hidden');
                        preview.removeAttribute('src');
                    }
                    if (previewVacia) {
                        previewVacia.classList.add('hidden');
                        previewVacia.removeAttribute('src');
                    }
                    if (icono) {
                        icono.classList.remove('hidden');
                    }
                    if (texto) {
                        texto.textContent = 'Click para subir foto';
                    }
                }
            });
        });
    </script>
</body>
</html>
