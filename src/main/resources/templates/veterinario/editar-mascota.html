<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragmentos-portal :: head"></div>
    <title>Vetopia - Editar Mascota</title>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">

<!-- TopNavBar Veterinario -->
<nav class="w-full top-0 sticky bg-[#0f1115] shadow-sm z-50">
    <div class="flex justify-between items-center w-full px-gutter max-w-container-max mx-auto h-20">
        <a class="hidden md:inline-flex px-6 py-3 rounded-full border border-gray-600 text-white hover:bg-white/10 transition-colors font-button text-button uppercase tracking-wider items-center gap-2" th:href="@{/}">
            <img alt="Vetopia Logo" class="h-8 w-auto" th:src="@{/images/logo_Vetopia.png}"/>
        </a>
        <div class="hidden md:flex gap-8">
            <a class="text-white font-bold border-b-2 border-white pb-1" th:href="@{/veterinario/mascotas}" style="color: rgb(127, 255, 212); border-color: rgb(127, 255, 212);">Pacientes</a>
            <a class="text-gray-300 font-body-md text-body-md hover:text-primary transition-colors" th:href="@{/veterinario/mascotas/clientes}">Clientes</a>
            <a class="text-gray-300 font-body-md text-body-md hover:text-primary transition-colors" href="#">Citas</a>
            <a class="text-gray-300 font-body-md text-body-md hover:text-primary transition-colors" th:href="@{/veterinario/mascotas/tratamientos}">Tratamientos</a>
        </div>
        <div class="flex items-center gap-4">
            <a class="hidden md:inline-flex px-6 py-3 rounded-full border border-gray-600 text-white hover:bg-white/10 transition-colors font-button text-button uppercase tracking-wider items-center gap-2" th:href="@{/logout}">
                Logout
            </a>
        </div>
    </div>
</nav>

<main class="flex-grow w-full max-w-container-max mx-auto px-gutter py-stack-lg">
    <section class="mb-stack-md">
        <a class="inline-flex items-center gap-2 font-button text-button uppercase tracking-widest text-secondary hover:text-primary transition-colors"
           th:href="@{/veterinario/mascotas}">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
            Volver a Mascotas
        </a>
    </section>

    <div class="max-w-2xl mx-auto">
        <h1 class="font-headline-xl text-headline-xl text-on-surface mb-2">Editar Mascota</h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-lg">Actualizar datos de la mascota</p>

        <form th:action="@{/veterinario/mascotas/editar}" method="post"
              class="bg-surface-container-lowest rounded-xl border border-surface-container-highest shadow-[0px_10px_30px_rgba(0,0,0,0.04)] p-stack-lg">
            <input type="hidden" name="id" th:value="${mascota.id}"/>
            <input type="hidden" name="duenoId" th:value="${mascota.duenoId}"/>
            <input type="hidden" name="fechaIngreso" th:value="${mascota.fechaIngreso}"/>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block font-label-md text-label-md uppercase tracking-widest text-on-surface-variant mb-2" for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" th:value="${mascota.nombre}" required
                           class="w-full px-4 py-3 rounded-lg border border-surface-container-highest bg-surface text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary"/>
                </div>
                <div>
                    <label class="block font-label-md text-label-md uppercase tracking-widest text-on-surface-variant mb-2" for="especie">Especie</label>
                    <input type="text" id="especie" name="especie" th:value="${mascota.especie}" required
                           class="w-full px-4 py-3 rounded-lg border border-surface-container-highest bg-surface text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary"/>
                </div>
                <div>
                    <label class="block font-label-md text-label-md uppercase tracking-widest text-on-surface-variant mb-2" for="raza">Raza</label>
                    <input type="text" id="raza" name="raza" th:value="${mascota.raza}"
                           class="w-full px-4 py-3 rounded-lg border border-surface-container-highest bg-surface text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary"/>
                </div>
                <div>
                    <label class="block font-label-md text-label-md uppercase tracking-widest text-on-surface-variant mb-2" for="edad">Edad</label>
                    <input type="number" step="0.1" id="edad" name="edad" th:value="${mascota.edad}"
                           class="w-full px-4 py-3 rounded-lg border border-surface-container-highest bg-surface text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary"/>
                </div>
                <div>
                    <label class="block font-label-md text-label-md uppercase tracking-widest text-on-surface-variant mb-2" for="sexo">Sexo</label>
                    <select id="sexo" name="sexo"
                            class="w-full px-4 py-3 rounded-lg border border-surface-container-highest bg-surface text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="Macho" th:selected="${mascota.sexo == 'Macho'}">Macho</option>
                        <option value="Hembra" th:selected="${mascota.sexo == 'Hembra'}">Hembra</option>
                    </select>
                </div>
                <div>
                    <label class="block font-label-md text-label-md uppercase tracking-widest text-on-surface-variant mb-2" for="pesoKg">Peso (kg)</label>
                    <input type="number" step="0.1" id="pesoKg" name="pesoKg" th:value="${mascota.pesoKg}"
                           class="w-full px-4 py-3 rounded-lg border border-surface-container-highest bg-surface text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary"/>
                </div>
                <div>
                    <label class="block font-label-md text-label-md uppercase tracking-widest text-on-surface-variant mb-2" for="color">Color</label>
                    <input type="text" id="color" name="color" th:value="${mascota.color}"
                           class="w-full px-4 py-3 rounded-lg border border-surface-container-highest bg-surface text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary"/>
                </div>
                <div>
                    <label class="block font-label-md text-label-md uppercase tracking-widest text-on-surface-variant mb-2" for="imagen">URL Imagen</label>
                    <input type="url" id="imagen" name="imagen" th:value="${mascota.imagen}"
                           class="w-full px-4 py-3 rounded-lg border border-surface-container-highest bg-surface text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary"/>
                </div>
                <div>
                    <label class="block font-label-md text-label-md uppercase tracking-widest text-on-surface-variant mb-2" for="estado">Estado</label>
                    <select id="estado" name="estado"
                            class="w-full px-4 py-3 rounded-lg border border-surface-container-highest bg-surface text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="Activo" th:selected="${mascota.estado == 'Activo'}">Activo</option>
                        <option value="Inactivo" th:selected="${mascota.estado == 'Inactivo'}">Inactivo</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-4 mt-stack-lg">
                <a th:href="@{/veterinario/mascotas}"
                   class="px-6 py-3 rounded-full border border-outline font-button text-button uppercase tracking-widest text-on-surface transition-colors hover:bg-surface-container-low">
                    Cancelar
                </a>
                <button type="submit"
                        class="px-6 py-3 rounded-full bg-primary font-button text-button uppercase tracking-widest text-on-primary transition-colors hover:bg-primary/90">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</main>

<footer th:replace="fragmentos-portal :: footer"></footer>
</body>
</html>
