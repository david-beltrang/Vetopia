<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragmentos-landing :: head"></div>
</head>
<body class="font-body-md text-body-md bg-background overflow-x-hidden min-h-screen flex flex-col">
    <main class="flex-1 flex items-center justify-center px-margin-mobile md:px-margin-desktop py-20">
        <div class="w-full max-w-xl text-center">
            <a class="inline-flex justify-center mb-10" th:href="@{/}">
                <img alt="Vetopia Logo" class="h-12 md:h-16 w-auto object-contain" th:src="@{/images/logo_Vetopia.png}"/>
            </a>

            <p class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant mb-4" th:if="${status != null}">
                Código de error <span class="text-mint-accent font-bold">[[${status}]]</span>
            </p>

            <h1 class="font-display-xl text-display-xl text-white leading-tight mb-6">¡UPS! ALGO<br/><span class="text-mint-accent text-shadow-mint">SALIÓ MAL</span></h1>

            <p class="text-body-lg text-on-surface-variant max-w-md mx-auto mb-10" th:text="${mensajeError} ?: 'No te preocupes, nada está perdido. Vuelve al inicio o intenta de nuevo.'">No te preocupes, nada está perdido. Vuelve al inicio o intenta de nuevo.</p>

            <div class="flex flex-wrap justify-center gap-4">
                <a class="btn-primary bg-mint-accent text-deep-carbon font-bold px-8 py-4 rounded-full font-label-sm text-label-sm uppercase tracking-widest transition-all duration-300 inline-flex items-center gap-2" th:href="@{/}">
                    Volver al inicio <span class="material-symbols-outlined text-[18px]">home</span>
                </a>
                <a class="btn-secondary border border-mint-accent text-mint-accent hover:bg-mint-accent/10 font-bold px-8 py-4 rounded-full font-label-sm text-label-sm uppercase tracking-widest transition-all duration-300 inline-flex items-center gap-2" href="#" onclick="history.back(); return false;">
                    Regresar <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                </a>
            </div>

            <div class="flex justify-center mt-10">
                <span class="material-symbols-outlined text-mint-accent text-shadow-mint text-[72px] md:text-[96px] leading-none">pets</span>
            </div>
        </div>
    </main>

    <footer class="bg-deep-carbon border-t border-white/10 py-6">
        <div class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop flex justify-center">
            <p class="text-xs uppercase tracking-widest text-gray-400">&copy; 2026 VETOPIA. CARE FOR THE NEXT GENERATION.</p>
        </div>
    </footer>
</body>
</html>
