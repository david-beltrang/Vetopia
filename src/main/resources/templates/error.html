<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Vetopia</title>
</head>
<body style="font-family: system-ui, sans-serif; background: #f5f5f5; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div style="background: #fff; padding: 40px; border-radius: 12px; max-width: 480px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.08);">
        <h1 style="margin: 0 0 8px; font-size: 44px; color: #c62828;">Error</h1>
        <h2 style="margin: 0 0 12px; color: #263238;">Algo salió mal</h2>
        <p style="color: #546e7a;" th:text="${mensaje}">Ha ocurrido un error.</p>
        <button type="button" onclick="history.back()" style="display: inline-block; margin: 16px 4px 0; padding: 10px 20px; background: #1565c0; color: #fff; border: none; border-radius: 20px; font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer;">Volver a la página anterior</button>
        <a href="/" style="display: inline-block; margin: 16px 4px 0; padding: 10px 20px; background: #1565c0; color: #fff; border-radius: 20px; text-decoration: none; font-weight: 600;">Volver al inicio</a>
    </div>
</body>
</html>
