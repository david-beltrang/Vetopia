<!-- CONTENIDO PRINCIPAL -->
<app-header-veterinario [veterinario]="veterinario"></app-header-veterinario>

<main class="flex-1">
    <div class="max-w-[604px] mx-auto px-gutter py-stack-lg">
        <!-- Título y subtítulo -->
        <div class="mb-stack-lg text-left">
            <h1 class="text-4xl font-bold text-gray-900 mb-1">Registrar Nueva Mascota</h1>
            <p class="text-base text-gray-600">Completar los detalles de la mascota para el cliente</p>
        </div>

        <!-- Formulario -->
        <app-formulario-registro
            (guardar)="onGuardar($event)"
            (guardarYLimpiar)="onGuardarYLimpiar($event)">
        </app-formulario-registro>
    </div>

    <!-- Gap entre formulario y footer -->
    <div class="h-16"></div>
</main>

<app-footer></app-footer>
