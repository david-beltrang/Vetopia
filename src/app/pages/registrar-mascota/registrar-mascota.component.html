<!-- CONTENIDO PRINCIPAL -->
<div class="tema-portal flex min-h-screen flex-col bg-background text-on-background font-body-md">
<app-header-veterinario [veterinario]="veterinario"></app-header-veterinario>

<main class="flex-1">
    <div class="max-w-container-max mx-auto px-gutter py-stack-lg">
        <!-- Encabezado de la sección -->
        <app-encabezado-registrar-mascota></app-encabezado-registrar-mascota>

        <!-- Formulario -->
        <app-formulario-mascota
            (guardar)="onGuardar($event)"
            (guardarYLimpiar)="onGuardarYLimpiar($event)">
        </app-formulario-mascota>
    </div>
</main>

<app-footer-portal></app-footer-portal>
</div>
