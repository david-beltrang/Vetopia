<!-- Subida de foto (solo visual, sin funcionalidad) -->
<label class="flex flex-col items-center gap-3 p-8 bg-white rounded-2xl border-2 border-dashed border-[#005F4B] cursor-pointer transition hover:border-emerald-700">
    <img *ngIf="tieneImagen"
         [src]="imagen()"
         [alt]="'Foto de ' + nombre()"
         class="w-24 h-24 rounded-full object-cover border border-gray-200"/>
    <div *ngIf="!tieneImagen"
         class="w-20 h-20 rounded-full bg-gray-100 flex items-center justify-center">
        <span class="material-symbols-outlined text-4xl text-gray-400">pets</span>
    </div>
    <span class="text-[#005F4B] text-sm font-semibold uppercase tracking-wider cursor-pointer hover:underline">Click para subir foto</span>
    <span class="text-gray-500 text-sm">JPG or PNG (Max 5MB)</span>
    <input type="file" accept="image/png,image/jpeg,image/gif" class="hidden" disabled/>
</label>
