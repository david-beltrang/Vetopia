<section id="ubicacion" class="mb-section-gap scroll-mt-28">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-gutter items-center">
    <div class="order-2 lg:order-1 rounded-3xl overflow-hidden border border-white/10 shadow-2xl aspect-video">
      <iframe class="w-full h-full" [src]="mapaEmbedUrl" style="border:0;" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa de ubicación de la sede demo Vetopia en Chicó, Bogotá"></iframe>
    </div>

    <div class="order-1 lg:order-2">
      <h2 class="font-headline-lg text-headline-lg mb-8 text-deep-carbon">¿DÓNDE <span class="text-mint-accent text-shadow-mint">UBICARNOS?</span></h2>
      <p class="text-body-lg text-text-secondary max-w-3xl">
        Visítanos en nuestra sede de demostración, ubicada en {{ ubicacion.direccion }}.
      </p>
    </div>
  </div>
</section>
