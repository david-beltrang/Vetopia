<!-- Columna izquierda: Hero visual con imagen de fondo -->
<div class="relative w-full bg-surface-container-high overflow-hidden flex items-end p-8 md:p-16">
    <!-- Gradiente superpuesto para mejorar legibilidad del texto -->
    <div class="absolute inset-0 bg-gradient-to-r from-[#0f1716]/60 to-[#0f1716]/20 z-10"></div>
    <!-- Imagen de fondo: veterinario con mascota -->
    <div class="absolute inset-0 z-0">
        <img src="images/veterinarioretriever.avif" alt="Veterinario sujetando un golden retriever"
             class="w-full h-full object-cover object-center"/>
    </div>

    <!-- Contenido del hero: logo, título y subtítulo -->
    <div class="relative z-20 max-w-[512px] w-full">
        <!-- Logo de Vetopia en color blanco -->
        <div class="mb-6">
            <img src="images/logo_Vetopia.png" alt="Vetopia Logo" class="h-16 w-auto object-contain brightness-0 invert"/>
        </div>

        <!-- Título principal del hero -->
        <h1 class="text-display-lg font-display-lg text-white leading-tight shadow-[0px_4px_3px_rgba(0,0,0,0.07),0px_2px_2px_rgba(0,0,0,0.06)] mb-4">
            Cuidamos a<br/>quienes más<br/>quieres.
        </h1>

        <!-- Subtítulo descriptivo -->
        <p class="text-body-lg font-body-lg text-white/90 shadow-[0px_1px_1px_rgba(0,0,0,0.05)]">
            Accede a tu portal para gestionar estados de<br/>salud, atenciones y tratamientos.
        </p>
    </div>
</div>
