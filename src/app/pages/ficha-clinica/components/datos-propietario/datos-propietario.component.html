<!-- Tarjeta de propietario: información del dueño de la mascota -->
<div class="p-8 h-full min-w-0 overflow-hidden bg-surface-container-lowest rounded-xl border border-surface-container-highest shadow-[0px_1px_2px_rgba(0,0,0,0.05)]">
    <div class="flex items-center gap-3 pb-4 mb-4 border-b border-surface-container-high">
        <span class="flex h-11 w-11 items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
        </span>
        <h3 class="font-headline-lg text-headline-lg text-on-surface">Propietario</h3>
    </div>
    <!-- Datos de contacto del propietario -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-8">
        <div>
            <dt class="mb-1 font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">Nombre</dt>
            <dd class="font-body-lg text-body-lg font-semibold text-on-surface break-words">
                {{ propietario()?.nombre || 'No registrado' }}
            </dd>
        </div>
        <div>
            <dt class="mb-1 font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">Teléfono</dt>
            <dd class="font-body-lg text-body-lg font-semibold text-on-surface break-words">
                {{ propietario()?.celular || 'No registrado' }}
            </dd>
        </div>
        <div>
            <dt class="mb-1 font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">Email</dt>
            <dd class="font-body-lg text-body-lg text-on-surface break-words">
                {{ propietario()?.correo || 'No registrado' }}
            </dd>
        </div>
    </div>
    <a class="mt-6 inline-flex w-full items-center justify-center rounded-full border border-outline px-8 py-2 font-button text-button uppercase tracking-widest text-on-surface transition-colors hover:bg-surface-container-low"
       (click)="navigateToPerfil()">
        Ver Perfil Completo
    </a>
</div>
