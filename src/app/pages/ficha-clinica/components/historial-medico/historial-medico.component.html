<!-- Historial médico cronológico: línea de tiempo de tratamientos -->
<div class="pt-10">
    <h3 class="text-3xl font-bold text-gray-900 mb-8">Historial Médico Cronológico</h3>
    <div class="border-l-2 border-gray-200 flex flex-col gap-8">
        <!-- Estado vacío: mascota sin tratamientos registrados -->
        <div *ngIf="historial().length === 0" class="relative pl-8">
            <span class="absolute -left-[9px] top-1 h-4 w-4 rounded-full bg-gray-300 border-4 border-white"></span>
            <div class="p-4 bg-white rounded-xl border border-gray-100 text-gray-500 text-sm">
                Esta mascota aún no tiene tratamientos registrados.
            </div>
        </div>

        <!-- Fila por cada tratamiento del historial -->
        <app-item-tratamiento *ngFor="let item of historial()" [item]="item"></app-item-tratamiento>
    </div>
</div>
