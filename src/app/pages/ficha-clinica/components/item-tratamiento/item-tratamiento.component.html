<!-- Fila por cada tratamiento del historial -->
<div class="relative pl-8">
    <span class="absolute -left-[9px] top-1 h-4 w-4 rounded-full border-4 border-surface-container-lowest"
          [class.bg-primary]="esCompletado()"
          [class.bg-outline]="!esCompletado"></span>
    <div class="p-4 bg-surface-container-lowest rounded-xl border border-surface-container-highest shadow-[0px_1px_2px_rgba(0,0,0,0.05)]">
        <!-- Cabecera del tratamiento: estado y fecha -->
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <span class="rounded-full px-3 py-1 font-label-md text-label-md uppercase tracking-widest"
                  [class]="esCompletado() ? 'bg-primary/10 text-primary' : 'bg-surface-container-high text-on-surface-variant'">
                {{ esCompletado() ? 'Completado' : 'Pendiente' }}
            </span>
            <span class="font-body-md text-body-md text-on-surface-variant">
                Fecha: {{ fechaFormateada() }}
            </span>
        </div>
        <!-- Título del tratamiento -->
        <h4 class="font-body-lg text-body-lg font-bold text-on-surface mb-3">{{ item()?.tratamiento?.titulo }}</h4>
        <!-- Datos del tratamiento en vertical -->
        <div class="ml-1 flex flex-col gap-3 rounded-lg bg-surface-container-low px-5 py-4 shadow-[0px_1px_2px_rgba(0,0,0,0.06)]">
            <p class="flex items-baseline gap-3 font-body-md text-body-md text-on-surface-variant">
                <span class="min-w-[110px] shrink-0 font-bold uppercase tracking-widest text-on-surface font-label-md text-label-md">Médico</span>
                <span>{{ nombreMedico() }}</span>
            </p>
            <p class="flex items-baseline gap-3 font-body-md text-body-md text-on-surface-variant">
                <span class="min-w-[110px] shrink-0 font-bold uppercase tracking-widest text-on-surface font-label-md text-label-md">Droga</span>
                <span>{{ item()?.drogaNombre }}</span>
            </p>
            <p class="flex items-baseline gap-3 font-body-md text-body-md text-on-surface-variant">
                <span class="min-w-[110px] shrink-0 font-bold uppercase tracking-widest text-on-surface font-label-md text-label-md">Descripción</span>
                <span class="leading-relaxed">{{ item()?.tratamiento?.descripcion }}</span>
            </p>
        </div>
    </div>
</div>
