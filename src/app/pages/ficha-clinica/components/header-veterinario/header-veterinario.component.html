<!-- HEADER: barra de navegación del panel veterinario -->
<nav class="w-full top-0 sticky bg-[#0f1115] shadow-sm z-50">
    <div class="flex justify-between items-center w-full px-gutter max-w-container-max mx-auto h-20">
        <!-- Logo: enlace al inicio del sistema -->
        <a class="hidden md:inline-flex px-6 py-3 rounded-full border border-gray-600 text-white hover:bg-white/10 transition-colors font-button text-button uppercase tracking-wider items-center gap-2" href="#">
            <img alt="Veto Precision Logo" class="h-8 w-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBGmAr_Hjp4ZCy8ezWVGciiNxUFa1a57lruSDgy0Xgk93QhrPSm4d8_uHrpj5GeNa8Gg7ipmkurP9qB75txOTGtJUl2O3Lps_uTsgVNoa-a34c6FNLAzDjLCSH5ZfIOMfLPBF4t-Twzkz4dvRsbGPzjr3wffVSkXbSjl5eiMJcgXm8I4yRlfxpuqeBtiFVV-UglKNkgxmK5yYEIB3TPFhPQC9TIA74zwryNrRCa5D_BeiKeTUJ9KI9bSUIY0pSF4GegTUA"/>
        </a>
        <!-- Navegación del veterinario: enlaces a secciones principales -->
        <div class="hidden md:flex gap-8">
            <a [class]="claseEnlace('pacientes')" [attr.aria-current]="esActiva('pacientes') ? 'page' : null" (click)="navigateToMascotas()">Pacientes</a>
            <a [class]="claseEnlace('clientes')" [attr.aria-current]="esActiva('clientes') ? 'page' : null" (click)="navigateToClientes()">Clientes</a>
            <a class="text-gray-300 font-body-md text-body-md hover:text-primary transition-colors duration-200" href="#">Citas</a>
            <a [class]="claseEnlace('tratamientos')" [attr.aria-current]="esActiva('tratamientos') ? 'page' : null" (click)="navigateToTratamientos()">Tratamientos</a>
        </div>
        <!-- Barra de herramientas: notificaciones, perfil del veterinario y logout -->
        <div class="flex items-center gap-4">
            <button aria-label="Notifications" class="hidden md:flex items-center justify-center w-10 h-10 rounded-full hover:bg-white/10 transition-colors text-white">
                <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
            </button>
            <div class="flex items-center gap-3">
                <div class="flex flex-col items-end hidden sm:flex">
                    <span class="font-label-md text-label-md text-white">{{ veterinario()?.nombre || 'Veterinario' }}</span>
                </div>
                <div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold">
                    {{ iniciales() }}
                </div>
            </div>
            <a class="hidden md:inline-flex px-6 py-3 rounded-full border border-gray-600 text-white hover:bg-white/10 transition-colors font-button text-button uppercase tracking-wider items-center gap-2" (click)="navigateToLogin()">
                Logout
            </a>
            <button class="md:hidden p-2 text-on-surface-variant">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>
    </div>
</nav>
