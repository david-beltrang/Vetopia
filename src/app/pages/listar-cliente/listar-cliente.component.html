<!-- CONTENIDO PRINCIPAL: listado de clientes -->
<div class="tema-portal flex min-h-screen flex-col bg-background text-on-background font-body-md">
<app-header-veterinario [veterinario]="veterinario" [veterinarioId]="veterinarioId" seccionActiva="clientes"></app-header-veterinario>

<main class="flex-1">
    <div class="max-w-container-max mx-auto px-gutter py-stack-lg">
        <!-- Encabezado de la sección: título y buscador -->
        <app-encabezado-clientes
            (nuevoCliente)="nuevoCliente()"
            (busqueda)="filtrarClientes($event)"></app-encabezado-clientes>

        <!-- Tabla de clientes: listado con columnas de información -->
        <app-tabla-clientes
            [clientes]="clientes"
            [textoContador]="textoContador"
            (verDetalle)="verDetalle($event)"></app-tabla-clientes>
    </div>
</main>

<app-footer-portal></app-footer-portal>
</div>
