<!-- Encabezado de la sección: título, buscador y botón de nuevo cliente -->
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-stack-lg">
    <div>
        <h1 class="text-headline-xl font-headline-xl text-on-surface">Clientes</h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant mt-1">Consulta la información de los clientes registrados en Vetopia</p>
    </div>

    <!-- Buscador por cédula y botón de crear cliente -->
    <div class="w-full md:max-w-[560px] flex items-center gap-3">
        <div class="flex flex-1 items-center gap-3 px-4 py-2 bg-surface-container-high rounded-full">
            <span class="material-symbols-outlined text-on-surface-variant">search</span>
            <input type="text"
                   placeholder="Buscar cliente..."
                   (input)="actualizarBusqueda($event)"
                   class="flex-1 bg-transparent text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none font-body-md text-body-md border-0"/>
        </div>
        <!-- Botón: registrar nuevo cliente -->
        <a id="btnNuevoCliente" class="inline-flex items-center gap-2 px-5 py-2.5 bg-primary-container text-on-primary-container font-button text-button uppercase rounded-full hover:bg-primary hover:text-on-primary transition-colors text-nowrap cursor-pointer"
           (click)="nuevoCliente.emit()">
            NUEVO CLIENTE
            <span class="material-symbols-outlined text-sm">add</span>
        </a>
    </div>
</div>
