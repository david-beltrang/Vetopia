<!-- Foto de la mascota con indicador de completado -->
<div class="relative mb-8">
    @if (mascota()?.imagen) {
        <img [src]="mascota()!.imagen" [alt]="'Foto de ' + mascota()!.nombre"
             class="w-24 h-24 rounded-full object-cover border border-surface-container-highest shadow-[0px_1px_2px_rgba(0,0,0,0.05)]"/>
    } @else {
        <div aria-label="Sin fotografía disponible" role="img"
             class="w-24 h-24 rounded-full bg-surface-container-high flex items-center justify-center border border-surface-container-highest">
            <span class="material-symbols-outlined text-4xl text-on-surface-variant">pets</span>
        </div>
    }
    <!-- Badge de completado superpuesto -->
    @if (mascota()) {
        <div class="absolute -bottom-1 -right-1 w-10 h-10 rounded-full bg-primary-container flex items-center justify-center border-4 border-surface-container-lowest" title="Completado">
            <span class="material-symbols-outlined text-xl text-primary">check</span>
        </div>
    }
</div>
