<!-- Formulario de edición de mascota -->
<form class="flex flex-col items-center gap-stack-lg" (ngSubmit)="onGuardar()">
    <!-- Identificadores ocultos -->
    <input type="hidden" name="id" [value]="mascota()?.id"/>
    <input type="hidden" name="veterinarioId" [value]="veterinarioId()"/>
    <input type="hidden" name="dueno.id" [value]="mascota()?.dueno?.id"/>

    <!-- Tarjeta del formulario -->
    <div class="w-full bg-white p-8 rounded-2xl shadow-[0_10px_25px_-5px_rgba(0,0,0,0.04)] border border-gray-100">
        <!-- Encabezado de sección -->
        <div class="border-b border-gray-200 pb-4 mb-6">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-[#005F4B] rounded-full"></div>
                <h2 class="text-xl font-bold text-gray-900 whitespace-nowrap">Información de la Mascota</h2>
            </div>
        </div>

        <!-- Campos del formulario -->
        <div class="flex flex-col gap-6">
            <!-- Subida de foto (solo visual) -->
            <app-upload-foto [imagen]="mascota()?.imagen || null" [nombre]="mascota()?.nombre || ''"></app-upload-foto>

            <!-- Nombre y Raza - Grid 2 columnas -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                    <label for="nombre" class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Nombre mascota</label>
                    <input id="nombre" name="nombre" type="text"
                           class="w-full px-4 py-3 bg-gray-50 rounded-lg border border-gray-200 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                           placeholder="e.g. Max"
                           [(ngModel)]="mascota()!.nombre"/>
                </div>
                <div class="flex flex-col gap-2">
                    <label for="raza" class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Raza</label>
                    <input id="raza" name="raza" type="text"
                           class="w-full px-4 py-3 bg-gray-50 rounded-lg border border-gray-200 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                           placeholder="e.g. Golden Retriever"
                           [(ngModel)]="mascota()!.raza"/>
                </div>
            </div>

            <!-- Edad y Peso - Grid 2 columnas -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                    <label for="edad" class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Edad (Años)</label>
                    <input id="edad" name="edad" type="number" step="0.1" min="0"
                           class="w-full px-4 py-3 bg-gray-50 rounded-lg border border-gray-200 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                           placeholder="e.g. 2"
                           [(ngModel)]="mascota()!.edad"/>
                </div>
                <div class="flex flex-col gap-2">
                    <label for="pesoKg" class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Peso (kg)</label>
                    <input id="pesoKg" name="pesoKg" type="number" step="0.1" min="0"
                           class="w-full px-4 py-3 bg-gray-50 rounded-lg border border-gray-200 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                           placeholder="e.g. 15.5"
                           [(ngModel)]="mascota()!.pesoKg"/>
                </div>
            </div>

            <!-- Especie y Sexo - Grid 2 columnas -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                    <label for="especie" class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Especie</label>
                    <select id="especie" name="especie"
                            class="w-full px-4 py-3 bg-gray-50 rounded-lg border border-gray-200 text-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                            [(ngModel)]="mascota()!.especie">
                        <option value="">Seleccionar especie...</option>
                        <option value="Perro">Perro</option>
                        <option value="Gato">Gato</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="flex flex-col gap-2">
                    <label for="sexo" class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Sexo</label>
                    <select id="sexo" name="sexo"
                            class="w-full px-4 py-3 bg-gray-50 rounded-lg border border-gray-200 text-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                            [(ngModel)]="mascota()!.sexo">
                        <option value="">Seleccionar sexo...</option>
                        <option value="Macho">Macho</option>
                        <option value="Hembra">Hembra</option>
                    </select>
                </div>
            </div>

            <!-- Campos: Color y Fecha de ingreso -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                    <label for="color" class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Color</label>
                    <input id="color" name="color" type="text"
                           class="w-full px-4 py-3 bg-gray-50 rounded-lg border border-gray-200 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                           placeholder="e.g. Marrón"
                           [(ngModel)]="mascota()!.color" required/>
                </div>
                <div class="flex flex-col gap-2">
                    <label for="fechaIngreso" class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Fecha de ingreso</label>
                    <input id="fechaIngreso" name="fechaIngreso" type="date"
                           class="w-full px-4 py-3 bg-gray-50 rounded-lg border border-gray-200 text-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
                           [value]="mascota()!.fechaIngreso | date:'yyyy-MM-dd'"
                           (change)="onFechaChange($event)" required/>
                </div>
            </div>
        </div>
    </div>

    <!-- Botones de acción -->
    <div class="flex flex-wrap items-center justify-between gap-4 pt-6 border-t border-gray-200">
        <a class="inline-flex items-center gap-2 rounded-full bg-gray-600 px-8 py-3 text-sm font-medium uppercase tracking-wider text-white transition-colors hover:bg-gray-700"
           (click)="onCancelar()">
            Cancelar
        </a>
        <button type="submit" class="inline-flex items-center gap-2 rounded-full bg-[#005F4B] px-8 py-3 text-sm font-medium uppercase tracking-wider text-white transition-colors hover:bg-[#004D3E]">
            Finalizado
            <span class="material-symbols-outlined text-lg">check</span>
        </button>
    </div>
</form>
