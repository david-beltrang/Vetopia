<!-- CONTENIDO PRINCIPAL -->
<div class="tema-portal flex min-h-screen flex-col bg-background text-on-background font-body-md">
<app-header-veterinario [veterinario]="veterinario"></app-header-veterinario>

<main class="flex-1">
    <div class="max-w-container-max mx-auto px-gutter py-stack-lg">
        <!-- Título y subtítulo -->
        <app-encabezado-editar-mascota></app-encabezado-editar-mascota>

        @if (cargando) {
            <app-cargando-mascota></app-cargando-mascota>
        } @else if (mascota) {
            <app-formulario-mascota
                [mascota]="mascota"
                (guardar)="onGuardar($event)"
                (cancelar)="onCancelar()">
            </app-formulario-mascota>
        } @else {
            <!-- Id no encontrado -->
            <app-mascota-no-encontrada (volver)="onCancelar()"></app-mascota-no-encontrada>
        }
    </div>
</main>

<app-footer-portal></app-footer-portal>
</div>
