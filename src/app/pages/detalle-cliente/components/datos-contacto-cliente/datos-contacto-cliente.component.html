<!-- Datos del cliente: información de contacto -->
<div class="px-8 py-6">
    <h2 class="mb-stack-md text-headline-md font-headline-md text-on-surface">Información de contacto</h2>
    <dl class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div>
            <dt class="font-label-md text-label-sm text-on-surface-variant uppercase tracking-widest mb-1">Cédula</dt>
            <dd class="font-body-md text-body-md text-on-surface">{{ cliente().cedula }}</dd>
        </div>
        <div>
            <dt class="font-label-md text-label-sm text-on-surface-variant uppercase tracking-widest mb-1">Correo</dt>
            <dd class="font-body-md text-body-md text-on-surface">{{ cliente().correo }}</dd>
        </div>
        <div>
            <dt class="font-label-md text-label-sm text-on-surface-variant uppercase tracking-widest mb-1">Teléfono</dt>
            <dd class="font-body-md text-body-md text-on-surface">{{ cliente().celular }}</dd>
        </div>
    </dl>
</div>
