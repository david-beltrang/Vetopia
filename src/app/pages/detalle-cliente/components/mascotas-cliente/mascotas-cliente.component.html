<!-- Mascotas del cliente -->
<div class="px-8 py-6 border-t border-surface-container-high">
    <h2 class="mb-stack-md text-headline-md font-headline-md text-on-surface">Mascotas del cliente</h2>
    @if (mascotas().length > 0) {
        <div class="flex flex-col gap-3">
            @for (mascota of mascotas(); track mascota.id) {
                <app-fila-mascota-cliente [mascota]="mascota" (verFicha)="verFicha.emit($event)"></app-fila-mascota-cliente>
            }
        </div>
    } @else {
        <p class="font-body-md text-body-md text-on-surface-variant">Este cliente aún no tiene mascotas registradas.</p>
    }
</div>
