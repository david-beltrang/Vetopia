<!-- Columna derecha: información detallada de la mascota -->
<div class="h-full bg-surface-container-lowest rounded-DEFAULT border border-surface-container-highest shadow-[0px_10px_30px_rgba(0,0,0,0.04)] p-4 md:p-5">
    <!-- ID del paciente formateado con 4 dígitos -->
    <p class="mb-2 font-label-md text-label-md uppercase tracking-widest text-primary">{{ numeroPaciente() }}</p>
    <h1 id="detalleNombreMascota" class="mb-5 font-headline-xl text-headline-xl text-on-surface">{{ mascota().nombre }}</h1>

    <!-- Datos básicos: grid de atributos de la mascota -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4 border-t border-surface-container-high">
        <div>
            <div class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">Especie</div>
            <p id="detalleEspecieMascota" class="font-body-lg text-body-lg font-semibold text-on-surface">{{ especie() }}</p>
        </div>
        <div>
            <div class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">Raza</div>
            <p id="detalleRazaMascota" class="font-body-lg text-body-lg font-semibold text-on-surface">{{ raza() }}</p>
        </div>
        <div>
            <div class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">Sexo</div>
            <p id="detalleSexoMascota" class="font-body-lg text-body-lg font-semibold text-on-surface">{{ sexo() }}</p>
        </div>
        <div>
            <div class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">Edad</div>
            <p id="detalleEdadMascota" class="font-body-lg text-body-lg font-semibold text-on-surface">{{ edad() }}</p>
        </div>
        <div>
            <div class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">Peso</div>
            <p id="detallePesoMascota" class="font-body-lg text-body-lg font-semibold text-on-surface">{{ peso() }}</p>
        </div>
        <div>
            <div class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">Estado</div>
            <p class="font-body-lg text-body-lg font-semibold text-on-surface">{{ estado() }}</p>
        </div>
    </div>
</div>
