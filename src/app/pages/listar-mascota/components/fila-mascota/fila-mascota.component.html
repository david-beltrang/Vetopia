<!-- Columna Foto: imagen de la mascota o icono por defecto -->
<td class="px-6 py-4">
    @if (mascota().imagen) {
        <img [src]="mascota().imagen" [alt]="'Foto de ' + mascota().nombre"
             class="h-14 w-14 rounded-full border border-surface-container-highest object-cover"/>
    } @else {
        <div aria-label="Sin fotografía disponible" role="img"
             class="flex h-14 w-14 items-center justify-center rounded-full bg-surface-container-high text-outline">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">pets</span>
        </div>
    }
</td>
<!-- Columna Nombre: nombre y número de paciente -->
<td class="px-6 py-4">
    <p class="font-label-md text-label-md text-on-surface">{{ mascota().nombre }}</p>
    <p class="text-xs uppercase tracking-widest text-on-surface-variant">{{ numeroPaciente() }}</p>
</td>
<!-- Columnas de datos básicos: especie, raza, edad y sexo -->
<td class="px-6 py-4 font-body-md text-body-md text-on-surface">{{ mascota().especie }}</td>
<td class="px-6 py-4 font-body-md text-body-md text-on-surface-variant">{{ mascota().raza }}</td>
<td class="px-6 py-4 font-body-md text-body-md text-on-surface">{{ edad() }}</td>
<td class="px-6 py-4 font-body-md text-body-md text-on-surface">{{ mascota().sexo }}</td>
<!-- Columna Estado: chip ovalado verde si está activa, rojo si está inactiva -->
<td class="px-6 py-4">
    <span class="inline-flex items-center rounded-full px-4 py-1.5 font-label-md text-label-md text-black"
          [class.bg-success-container]="esActiva()"
          [class.bg-error-container-dark]="!esActiva()">
        {{ esActiva() ? 'Activa' : 'Inactiva' }}
    </span>
</td>
<!-- Columna Acciones: botón para ver detalles de la mascota -->
<td class="px-6 py-4">
    <a class="inline-flex items-center gap-2 rounded-full bg-primary-container px-5 py-2.5 font-button text-button uppercase text-on-primary-container transition-colors hover:bg-primary hover:text-on-primary cursor-pointer"
       [attr.aria-label]="'Consultar detalles de ' + mascota().nombre"
       (click)="verDetalle.emit(mascota())">
        Ver detalles
        <span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">visibility</span>
    </a>
</td>
