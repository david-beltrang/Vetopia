<!-- Tarjeta individual de indicador. -->
<article class="bg-white rounded-2xl p-5 border border-[#e0e3e5] card-shadow hover:shadow-md transition-shadow flex flex-col justify-between h-full">
  <div class="flex items-start justify-between">
    <div>
      <p class="text-xs uppercase tracking-wider font-semibold text-[#58605f]">{{ title() }}</p>
      <h3 class="text-2xl sm:text-3xl font-extrabold mt-1" [class]="valueClass()">{{ value() }}</h3>
    </div>
    <div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0" [class]="iconBgClass() + ' ' + iconTextClass()">
      <span class="material-symbols-outlined text-2xl">{{ icon() }}</span>
    </div>
  </div>
</article>
