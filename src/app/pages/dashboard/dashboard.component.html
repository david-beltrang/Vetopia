<!-- Encabezado del administrador. -->
<app-header-admin [adminId]="adminId" seccionActiva="dashboard"></app-header-admin>

<!-- Contenido principal del dashboard. -->
<main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 md:px-8 py-8">
  <!-- Título y contexto de la página. -->
  <app-dashboard-encabezado></app-dashboard-encabezado>

  <!-- Tabla de indicadores principales (KPI Grid). -->
  <section class="mb-8" data-purpose="kpi-indicators">
    <!-- Indicadores principales. -->
    <app-kpi-grid></app-kpi-grid>
  </section>

  <!-- Gráficos de tratamientos y top tratamientos. -->
  <section class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8" data-purpose="treatments-analytics">
    <div class="lg:col-span-7">
      <app-tratamientos-por-medicamento></app-tratamientos-por-medicamento>
    </div>
    <div class="lg:col-span-5">
      <app-top-tratamientos></app-top-tratamientos>
    </div>
  </section>
</main>
<!-- Footer del portal. -->
<app-footer-portal></app-footer-portal>
