<div class="tema-portal flex min-h-screen flex-col bg-background text-on-background font-body-md">
<app-header-veterinario [veterinario]="veterinario" [veterinarioId]="veterinarioId"></app-header-veterinario>

<main class="flex-grow w-full max-w-container-max mx-auto px-gutter py-stack-lg">
    <!-- Encabezado de la sección: título y descripción -->
    <app-encabezado-mascotas
        (busqueda)="filtrarPorNombre($event)"
        (soloAtendidas)="cambiarFiltroAtendidas($event)">
    </app-encabezado-mascotas>

    <!-- Tarjeta contenedora del listado: tabla con mascotas -->
    <app-tabla-mascotas
        [mascotas]="mascotas"
        [textoContador]="textoContador"
        [duenosPorId]="duenosPorId"
        (verFicha)="verFicha($event)"></app-tabla-mascotas>
</main>

<app-footer-portal></app-footer-portal>
</div>
