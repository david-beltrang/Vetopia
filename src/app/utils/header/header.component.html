<header class="fixed top-0 w-full z-50 glass-header border-b border-white/10 bg-deep-carbon/80 backdrop-blur-xl" [class.scrolled]="isScrolled">
  <div class="flex justify-between items-center px-margin-desktop py-6 w-full max-w-container-max mx-auto">

    <a href="#" class="flex items-center">
      <img src="images/logo_Vetopia.png" alt="Vetopia Logo" class="h-12 w-auto object-contain">
    </a>

    <nav class="hidden md:flex gap-8 items-center font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant">
      <a href="#servicios" class="hover:text-primary transition-colors duration-300 font-medium">Qué hacemos</a>
      <a href="#equipo" class="hover:text-primary transition-colors duration-300 font-medium">Equipo</a>
      <a href="#funcionamiento" class="hover:text-primary transition-colors duration-300 font-medium">Funcionamiento</a>
      <a href="#ubicacion" class="hover:text-primary transition-colors duration-300 font-medium">Ubicación</a>
      <a href="#contacto" class="hover:text-primary transition-colors duration-300 font-medium">Contacto</a>
    </nav>

    <div class="hidden md:flex items-center gap-4">
      <a href="#" class="flex items-center gap-2 border border-white rounded-[35px] px-4 py-2 text-on-surface-variant hover:text-primary font-label-sm text-label-sm uppercase tracking-widest transition-colors">
        Log In <span class="material-symbols-outlined text-[16px]">login</span>
      </a>

      <a href="#" class="btn-primary bg-mint-accent text-deep-carbon font-bold px-6 py-3 rounded-DEFAULT font-label-sm text-label-sm uppercase tracking-widest transition-all duration-300">
        Agendar cita
      </a>
    </div>

    <button class="md:hidden text-white">
      <span class="material-symbols-outlined text-[32px]">menu</span>
    </button>
  </div>
</header>
