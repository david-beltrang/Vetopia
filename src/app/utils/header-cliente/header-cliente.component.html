<!-- TopNavBar del Portal del Cliente: barra de navegación fija -->
<header class="sticky top-0 z-50 bg-[#0f1115] text-white">
    <div class="max-w-container-max mx-auto flex items-center justify-between px-gutter py-stack-md">
        <!-- Logo y nombre del portal -->
        <a class="flex items-center gap-3 cursor-pointer" (click)="irInicio()">
            <img alt="Vetopia Logo" class="h-10 w-auto object-contain" src="/images/logo_Vetopia.png"/>
            <span class="hidden sm:block font-label-md text-label-md uppercase tracking-widest text-gray-300">Portal Cliente</span>
        </a>
        <!-- Navegación del portal: enlaces a secciones principales -->
        <nav class="flex items-center gap-6 md:gap-8 font-label-md text-label-md uppercase tracking-widest">
            <a class="cursor-pointer border-b-2 pb-1 transition-colors"
               [class.font-bold]="seccionActiva() === 'mascotas'"
               [class.text-primary-fixed]="seccionActiva() === 'mascotas'"
               [class.border-primary-fixed]="seccionActiva() === 'mascotas'"
               [class.text-gray-300]="seccionActiva() !== 'mascotas'"
               [class.border-transparent]="seccionActiva() !== 'mascotas'"
               (click)="irMascotas()">Mascotas</a>
            <a id="citasClienteTest" class="cursor-pointer border-b-2 pb-1 transition-colors"
               [class.font-bold]="seccionActiva() === 'citas'"
               [class.text-primary-fixed]="seccionActiva() === 'citas'"
               [class.border-primary-fixed]="seccionActiva() === 'citas'"
               [class.text-gray-300]="seccionActiva() !== 'citas'"
               [class.border-transparent]="seccionActiva() !== 'citas'"
               (click)="irCitas()">Citas</a>
            <a class="flex items-center gap-2 text-gray-300 hover:text-error transition-colors cursor-pointer" (click)="cerrarSesion()">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">logout</span>
                Cerrar Sesión
            </a>
        </nav>
    </div>
</header>
